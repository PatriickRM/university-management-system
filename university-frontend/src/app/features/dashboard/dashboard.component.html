<div class="dashboard-container">
  <!-- Bienvenida -->
  <div class="welcome-section">
    @if (currentUser$ | async; as user) {
      <div class="welcome-card">
        <div class="user-avatar">
          <mat-icon>account_circle</mat-icon>
        </div>
        <div class="welcome-text">
          <h1>¡Bienvenido, {{ user.firstName }}!</h1>
          <p>{{ user.email }}</p>
          <div class="user-roles">
            @for (role of user.roles; track role.id) {
              <span class="role-chip">{{ role.name }}</span>
            }
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Dashboard carta -->
  <div class="cards-grid">
    @for (card of cards; track card.title) {
      <mat-card class="dashboard-card" [routerLink]="card.route">
        <div class="card-icon" [style.background-color]="card.color">
          <mat-icon>{{ card.icon }}</mat-icon>
        </div>
        <mat-card-content>
          <h3>{{ card.title }}</h3>
          <p class="card-value">{{ card.value }}</p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button color="primary">
            Ver más
            <mat-icon>arrow_forward</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>

  <!-- Acciones rapidas -->
  <div class="quick-actions">
    <h2>Acciones Rápidas</h2>
    <div class="actions-grid">
      <button mat-raised-button color="primary" routerLink="/courses">
        <mat-icon>search</mat-icon>
        Buscar Cursos
      </button>
      <button mat-raised-button color="accent" routerLink="/enrollments">
        <mat-icon>assignment</mat-icon>
        Mis Matrículas
      </button>
    </div>
  </div>
</div>
